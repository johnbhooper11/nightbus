<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightbus</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🚍 Nightbus</h1>
  <div id="map"></div>
  <div id="controls">
    <label for="radius">Alert radius: <span id="radius-value">200</span>m</label>
    <input type="range" id="radius" min="50" max="1000" value="200" step="50" />
    <button id="clear-destination">Clear Destination</button>
  </div>
  <div id="status">Tap on the map to set your destination</div>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="script.js"></script>
</body>
</html>
